name: Tests

on: [push]

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [26.x]

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: nick
          POSTGRES_PASSWORD: nick
          POSTGRES_DB: nick
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4

      # Node setup
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Enable corepack
        shell: bash
        run: npm i -g corepack@latest && corepack enable

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@v4
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      # Bootstrap application
      - name: Bootstrap application
        run: pnpm bootstrap

      # Run tests
      - name: Run tests
        env:
          API_RATE_LIMIT: 1000
          AUTH_RATE_LIMIT: 1000
        run: pnpm test

  upgrade:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [26.x]

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: nick
          POSTGRES_PASSWORD: nick
          POSTGRES_DB: nick
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Node setup
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Enable corepack
        shell: bash
        run: npm i -g corepack@latest && corepack enable

      # Bootstrap the version before this push
      - name: Bootstrap the previous version
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          BASE="$BEFORE"
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then BASE=HEAD~1; fi
          echo "Upgrading from $(git rev-parse --short "$BASE")"
          git checkout -q "$BASE"
          pnpm bootstrap

      # Migrate and upgrade to this version; fails on any error
      - name: Migrate and upgrade
        run: |
          git checkout -q ${{ github.sha }}
          pnpm install --frozen-lockfile
          pnpm nick --modules=migrate
          pnpm nick --modules=migrate
